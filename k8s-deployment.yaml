apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-management-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-management
  template:
    metadata:
      labels:
        app: event-management
    spec:
      containers:
      - name: event-management
        image: online-event-management:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: event-management-service
spec:
  type: NodePort
  selector:
    app: event-management
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
